<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0c0f">
<title>Color Battle</title>
<style>
:root {
    color-scheme: dark;
    --bg: #0b0c0f;
    --panel: #13151a;
    --panel-2: #191c22;
    --border: #2a2e37;
    --text: #f4f6f8;
    --muted: #9097a3;
    --accent: #f5f7fa;
    --danger: #ff6b6b;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
    margin: 0;
    min-height: 100%;
    background:
        radial-gradient(circle at 50% -120px, rgba(255,255,255,.08), transparent 340px),
        var(--bg);
    color: var(--text);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
button, input { font: inherit; }
button { -webkit-tap-highlight-color: transparent; }
.app {
    width: min(1120px, 100%);
    margin: 0 auto;
    padding: 24px 20px 42px;
}
.hero {
    text-align: center;
    margin-bottom: 20px;
}
.hero h1 {
    margin: 0;
    font-size: clamp(26px, 5vw, 40px);
    letter-spacing: -.04em;
}
.hero p {
    margin: 7px 0 0;
    color: var(--muted);
    font-size: 14px;
}
.battle {
    display: grid;
    grid-template-columns: minmax(0,1fr) 64px minmax(0,1fr);
    gap: 14px;
    align-items: center;
}
.vs {
    text-align: center;
    color: #555d69;
    font-weight: 900;
    font-size: 25px;
    letter-spacing: .08em;
}
.color-button {
    position: relative;
    min-width: 0;
    height: clamp(270px, 38vw, 410px);
    padding: 0;
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 22px;
    overflow: hidden;
    cursor: pointer;
    outline: none;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.04);
    transition: transform 110ms ease, filter 110ms ease, box-shadow 110ms ease;
    touch-action: manipulation;
}
.color-button:focus-visible {
    box-shadow: 0 0 0 4px #fff, 0 0 0 7px #181b21;
}
@media (hover:hover) and (pointer:fine) {
    .color-button:hover {
        transform: translateY(-3px);
        box-shadow: 0 18px 48px rgba(0,0,0,.36);
    }
}
.color-button:active { transform: scale(.975); }
.color-button.chosen {
    animation: chosen 190ms ease-out;
    box-shadow: 0 0 0 5px #fff, 0 16px 42px rgba(0,0,0,.42);
    z-index: 3;
}
.color-button.rejected {
    filter: brightness(.56) saturate(.58);
    transform: scale(.965);
}
.color-button.chosen::after {
    content: "✓";
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    color: #fff;
    font-size: clamp(60px, 10vw, 96px);
    font-weight: 1000;
    text-shadow: 0 4px 18px rgba(0,0,0,.5);
    animation: check .19s ease-out;
}
@keyframes chosen {
    0% { transform: scale(1); }
    45% { transform: scale(.955); }
    100% { transform: scale(1.018); }
}
@keyframes check {
    from { opacity: 0; transform: scale(.38); }
    to { opacity: 1; transform: scale(1); }
}
.burst {
    position: absolute;
    width: 18px;
    height: 18px;
    border: 4px solid rgba(255,255,255,.92);
    border-radius: 999px;
    transform: translate(-50%,-50%);
    pointer-events: none;
    animation: burst .36s ease-out forwards;
}
@keyframes burst {
    to { width: 190px; height: 190px; opacity: 0; }
}
.color-info {
    position: absolute;
    left: 12px;
    right: 12px;
    bottom: 12px;
    padding: 11px 13px;
    border-radius: 12px;
    background: rgba(5,7,10,.58);
    color: white;
    text-align: left;
    pointer-events: none;
    backdrop-filter: blur(8px);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.08);
}
.hex {
    font-weight: 900;
    font-size: clamp(17px, 2.5vw, 23px);
    letter-spacing: .02em;
}
.rgb {
    margin-top: 2px;
    font-size: 12px;
    opacity: .74;
}
.toolbar {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 9px;
    margin-top: 16px;
}
.btn {
    min-height: 44px;
    padding: 9px 16px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: #1b1e24;
    color: var(--text);
    cursor: pointer;
    transition: background .12s ease, transform .12s ease, border-color .12s ease;
}
.btn:hover { background: #232730; }
.btn:active { transform: scale(.97); }
.btn.primary {
    background: #f2f4f7;
    color: #111318;
    border-color: #f2f4f7;
    font-weight: 800;
}
.btn.danger { color: #ff9b9b; }
.btn:disabled {
    opacity: .45;
    cursor: default;
    transform: none;
}
.panel {
    margin-top: 22px;
    padding: 18px;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: rgba(19,21,26,.94);
}
.progress-head {
    display: flex;
    justify-content: space-between;
    gap: 18px;
    align-items: end;
}
.eyebrow {
    color: var(--muted);
    font-size: 12px;
}
.big-value {
    margin-top: 2px;
    font-size: clamp(28px, 5vw, 38px);
    font-weight: 950;
    letter-spacing: -.04em;
}
.status-text {
    color: var(--muted);
    text-align: right;
    font-size: 13px;
    line-height: 1.5;
}
.progress-track {
    margin-top: 13px;
    height: 12px;
    border-radius: 999px;
    background: #292d35;
    overflow: hidden;
}
.progress-fill {
    width: 0%;
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(90deg, #8f97a3, #f5f7fa);
    transition: width .25s ease;
}
.goal-note {
    margin-top: 8px;
    color: #777f8c;
    font-size: 12px;
    line-height: 1.5;
}
.stats {
    display: grid;
    grid-template-columns: repeat(5, minmax(0,1fr));
    gap: 8px;
    margin-top: 10px;
}
.stat {
    min-width: 0;
    padding: 13px 10px;
    border: 1px solid #272b33;
    border-radius: 11px;
    background: #14171c;
    text-align: center;
}
.stat-label {
    display: block;
    color: #7f8793;
    font-size: 11px;
}
.stat-value {
    display: block;
    margin-top: 4px;
    font-size: clamp(16px, 2.5vw, 21px);
    font-weight: 850;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.section-title {
    margin: 34px 0 12px;
    font-size: 21px;
    letter-spacing: -.02em;
}
.tier {
    display: grid;
    grid-template-columns: 64px minmax(0,1fr);
    min-height: 76px;
    margin-bottom: 7px;
}
.tier-label {
    display: grid;
    place-items: center;
    color: #111;
    font-size: 29px;
    font-weight: 1000;
}
.tier-label.S { background: #ff8080; }
.tier-label.A { background: #ffbd78; }
.tier-label.B { background: #fff37d; }
.tier-label.C { background: #82e98a; }
.tier-label.D { background: #82b8ff; }
.tier-colors {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-content: flex-start;
    padding: 7px;
    background: #16191e;
    border: 1px solid #252932;
    border-left: 0;
}
.rank-color {
    position: relative;
    width: 49px;
    height: 49px;
    flex: 0 0 49px;
    border-radius: 7px;
    border: 1px solid rgba(255,255,255,.11);
    overflow: hidden;
}
.rank-number {
    position: absolute;
    top: 3px;
    left: 3px;
    min-width: 20px;
    height: 19px;
    padding: 0 4px;
    display: grid;
    place-items: center;
    border-radius: 999px;
    background: rgba(0,0,0,.72);
    color: #fff;
    font-size: 10px;
    font-weight: 900;
}
.rank-confidence {
    position: absolute;
    left: 3px;
    right: 3px;
    bottom: 3px;
    height: 3px;
    border-radius: 99px;
    overflow: hidden;
    background: rgba(0,0,0,.28);
}
.rank-confidence > span {
    display: block;
    height: 100%;
    background: rgba(255,255,255,.9);
}
.footer-note {
    margin-top: 18px;
    color: #707783;
    font-size: 12px;
    line-height: 1.6;
}
.hidden-input { display:none; }

@media (max-width: 720px) {
    .app { padding: 16px 12px 34px; }
    .hero { margin-bottom: 14px; }
    .battle {
        grid-template-columns: minmax(0,1fr) minmax(0,1fr);
        gap: 8px;
    }
    .vs { display: none; }
    .color-button {
        height: clamp(245px, 72vw, 330px);
        border-radius: 16px;
    }
    .color-info {
        left: 8px;
        right: 8px;
        bottom: 8px;
        padding: 9px 10px;
        border-radius: 9px;
    }
    .toolbar {
        display: grid;
        grid-template-columns: repeat(2, minmax(0,1fr));
    }
    .toolbar .btn { width: 100%; }
    .progress-head { align-items: start; }
    .status-text { max-width: 46%; }
    .stats { grid-template-columns: repeat(2, minmax(0,1fr)); }
    .tier { grid-template-columns: 46px minmax(0,1fr); }
    .tier-label { font-size: 23px; }
    .tier-colors { gap: 5px; padding: 5px; }
    .rank-color {
        width: 42px;
        height: 42px;
        flex-basis: 42px;
    }
}
@media (max-width: 380px) {
    .rgb { display: none; }
    .toolbar { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: .001ms !important;
        transition-duration: .001ms !important;
    }
}
</style>
</head>
<body>
<main class="app">
    <header class="hero">
        <h1>Color Battle</h1>
        <p id="subtitle">より好きな色を選択</p>
    </header>

    <section class="battle" aria-label="色比較">
        <button id="leftColor" class="color-button" type="button" aria-label="左の色を選択">
            <div class="color-info">
                <div id="leftHex" class="hex"></div>
                <div id="leftRgb" class="rgb"></div>
            </div>
        </button>

        <div class="vs" aria-hidden="true">VS</div>

        <button id="rightColor" class="color-button" type="button" aria-label="右の色を選択">
            <div class="color-info">
                <div id="rightHex" class="hex"></div>
                <div id="rightRgb" class="rgb"></div>
            </div>
        </button>
    </section>

    <div class="toolbar">
        <button id="skip" class="btn" type="button">スキップ</button>
        <button id="exportImage" class="btn primary" type="button">ランキング画像を保存</button>
        <button id="exportData" class="btn" type="button">データを書き出す</button>
        <button id="importData" class="btn" type="button">データを復元</button>
        <button id="reset" class="btn danger" type="button">全データ削除</button>
        <input id="importFile" class="hidden-input" type="file" accept="application/json,.json">
    </div>

    <section class="panel">
        <div class="progress-head">
            <div>
                <div class="eyebrow">最終ランキング信頼度</div>
                <div id="goalProbability" class="big-value">計算中</div>
            </div>
            <div id="progressStatus" class="status-text">
                近傍順位を重点比較
            </div>
        </div>

        <div class="progress-track" aria-hidden="true">
            <div id="progressFill" class="progress-fill"></div>
        </div>

        <div class="goal-note">
            目標: 125色の90%以上が±5位以内、Top10が±2位以内、さらに1〜3位の順番が完全一致する確率が90%以上。
            Tierは比較制約には使わず、現在順位から表示だけを行います。
        </div>
    </section>

    <section class="stats">
        <div class="stat">
            <span class="stat-label">総比較回数</span>
            <strong id="battleCount" class="stat-value">0</strong>
        </div>
        <div class="stat">
            <span class="stat-label">±5条件 90%信頼</span>
            <strong id="normalTrusted" class="stat-value">0 / 113</strong>
        </div>
        <div class="stat">
            <span class="stat-label">Top10 ±2 90%信頼</span>
            <strong id="topTrusted" class="stat-value">0 / 10</strong>
        </div>
        <div class="stat">
            <span class="stat-label">Top3 順位完全一致</span>
            <strong id="top3Exact" class="stat-value">0%</strong>
        </div>
        <div class="stat">
            <span class="stat-label">ブラウザ保存</span>
            <strong id="saveStatus" class="stat-value">-</strong>
        </div>
    </section>

    <h2 class="section-title">Current Ranking</h2>
    <div id="tiers"></div>

    <p class="footer-note">
        左右キーでも選択できます。内部レートは表示しません。
        画像出力は高解像度PNGで、順位・HEX・Tierをまとめて保存します。
    </p>
</main>

<script src="color-core.js"></script>
<script src="color-ui.js"></script>
<script src="color-init.js"></script>
</body>
</html>
